<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Walled DLP Guard</title>
<style>
  :root { color-scheme: light; font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #0f172a; color: #e2e8f0; user-select: none; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; }
  .brand svg { width: 20px; height: 20px; }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tab { border: 0; background: transparent; color: #cbd5e1; padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 550; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .tab:hover { background: #1e293b; }
  .tab[aria-selected="true"] { background: #f8fafc; color: #0f172a; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .tab.loading .dot { background: #f59e0b; }
  .nav { display: flex; gap: 2px; margin-left: 6px; }
  .icon { border: 0; background: transparent; color: #cbd5e1; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 16px; line-height: 30px; padding: 0; }
  .icon:hover:not(:disabled) { background: #1e293b; }
  .icon:disabled { opacity: .35; cursor: default; }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; background: #064e3b; color: #a7f3d0; padding: 6px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .status b { color: #ecfdf5; font-weight: 600; }
  label.color { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #cbd5e1; cursor: pointer; white-space: nowrap; }
  input[type=color] { width: 26px; height: 22px; border: 1px solid #334155; border-radius: 4px; padding: 0; background: none; cursor: pointer; }
  .btn { border: 1px solid #334155; background: #1e293b; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #334155; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
    Walled DLP Guard
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="chatgpt" title="ChatGPT (Ctrl+1)"><span class="dot"></span>ChatGPT</button>
    <button class="tab" role="tab" data-tab="perplexity" title="Perplexity (Ctrl+2)"><span class="dot"></span>Perplexity</button>
  </div>
  <div class="nav">
    <button class="icon" id="back" title="Back (Alt+Left)">&#8592;</button>
    <button class="icon" id="forward" title="Forward (Alt+Right)">&#8594;</button>
    <button class="icon" id="reload" title="Reload (Ctrl+R)">&#8635;</button>
    <button class="icon" id="home" title="New chat">&#8962;</button>
  </div>
  <div class="spacer"></div>
  <div class="status" title="Prompts and file uploads are inspected before they are sent"><span>&#9679;</span> Protected · marker <b id="marker">WALLED_SENSITIVE</b></div>
  <label class="color" title="Text colour of AI responses">AI response colour <input type="color" id="color" value="#c2410c"></label>
  <button class="btn" id="audit" title="Audit log (Ctrl+L)">Audit log</button>
  <script src="toolbar.js"></script>
</body>
</html>
